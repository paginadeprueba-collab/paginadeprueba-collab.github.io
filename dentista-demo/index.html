<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Consultorio Odontológico Demo | Palermo, CABA</title>
<meta name="description" content="Demo de consultorio odontológico: limpieza, ortodoncia, implantes, blanqueamiento y urgencias.">
<meta name="theme-color" content="#EEEAFD">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:clip;max-width:100%}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
:root{--acc:#6C5CE7;--acc2:#5847D6;--tint:#EEEAFD;--tint2:#F6F4FE;--bg:#F7F7FA;--card:#fff;--tile:#F3F3F6;--ink:#16161D;--muted:#7A7A88;--line:#ECECF2;--sh:0 10px 30px -14px rgba(40,30,90,.18)}
body{font-family:'Plus Jakarta Sans',Manrope,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:96px}
a{color:inherit;text-decoration:none}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
svg{display:block}
.app{display:grid;grid-template-columns:minmax(0,1fr);justify-content:center}
.screen,.cards>*,.phead>*{min-width:0}
.screen{width:100%;max-width:480px;margin:0 auto;background:linear-gradient(180deg,#E6E0FC 0%,#F1EEFD 140px,#fff 330px);padding:18px 18px 28px;position:relative}
.screen+.screen{background:linear-gradient(180deg,#F1EEFD 0%,#fff 260px)}
@media(min-width:960px){
 body{background:radial-gradient(60% 50% at 20% 0%,#EAE5FD,transparent 70%),radial-gradient(50% 40% at 90% 10%,#F1EEFD,transparent 70%),var(--bg)}
 .app{grid-template-columns:440px 440px;gap:36px;padding:36px 20px 10px}
 .screen{border-radius:40px;box-shadow:0 40px 80px -40px rgba(40,30,90,.35),0 0 0 8px #fff;margin:0;min-height:860px}
}
/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.me{display:flex;align-items:center;gap:10px;min-width:0}
.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--acc),#A99CF5);color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px;flex:none;box-shadow:0 0 0 3px #fff}
.me small{display:block;color:var(--muted);font-size:11.5px;font-weight:500}
.me b{display:block;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rbtns{display:flex;gap:8px;flex:none}
.rb{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:var(--sh);color:var(--ink)}
.rb svg{width:20px;height:20px}
.greet{margin:24px 0 18px}
.greet .l1{font-size:clamp(24px,7vw,30px);font-weight:300;letter-spacing:-.03em;line-height:1.15}
.greet .l2{font-size:clamp(24px,7vw,30px);font-weight:800;letter-spacing:-.035em;line-height:1.15}
.greet p{color:var(--muted);font-size:13.5px;margin-top:8px}
/* tabs */
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:2px 18px 4px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:10px 18px;border-radius:999px;background:#fff;font-weight:600;font-size:13px;box-shadow:0 4px 14px -8px rgba(40,30,90,.25);transition:.2s}
.tab.on{background:var(--acc);color:#fff;box-shadow:0 10px 20px -10px rgba(108,92,231,.8)}
/* cards */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.pcard{background:#fff;border-radius:24px;padding:14px 12px 14px;box-shadow:var(--sh);position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.badge{position:absolute;top:12px;left:12px;font-size:10px;font-weight:700;color:#3d8b5a;background:#E8F5EC;border-radius:999px;padding:3px 8px}
.badge.u{color:#b0413e;background:#FBEAEA}
.cimg{width:74px;height:74px;border-radius:50%;background:var(--tint);color:var(--acc);display:grid;place-items:center;margin:22px 0 10px;box-shadow:inset 0 0 0 6px #F7F5FE}
.cimg svg{width:32px;height:32px}
.pcard h4{font-size:13.5px;font-weight:700;line-height:1.25}
.pcard .s{font-size:11.5px;color:var(--muted);margin-top:2px}
.pcard .rt{font-size:11.5px;font-weight:600;margin-top:6px;color:var(--ink)}
.pcard .rt i{font-style:normal;color:#F5A623}
.pcard .pr{font-size:17px;font-weight:800;color:var(--acc);margin-top:6px;letter-spacing:-.02em}
.pcard .pr small{display:block;font-size:10px;color:var(--muted);font-weight:600;letter-spacing:0}
/* section heads */
.sh{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px}
.sh h3{font-size:16px;font-weight:800;letter-spacing:-.02em}
.sh a,.sh button{font-size:12.5px;font-weight:600;color:var(--acc)}
.sh .lbl{font-size:11px;font-weight:600;color:var(--muted)}
/* reviews */
.revs{position:relative;height:172px}
.rv{position:absolute;inset:0;background:#fff;border-radius:24px;padding:16px 18px;box-shadow:var(--sh);display:flex;flex-direction:column;justify-content:space-between;opacity:0;transform:translateX(18px);transition:opacity .35s,transform .35s}
.rv.on{opacity:1;transform:none}
.rv .hd{display:flex;align-items:center;justify-content:space-between}
.rv .sc{display:flex;align-items:center;gap:6px;font-weight:800;font-size:13px;color:var(--acc);background:var(--tint);border-radius:999px;padding:4px 10px}
.stars{color:#F5A623;letter-spacing:1.5px;font-size:13px}
.rv q{font-size:14.5px;font-weight:600;line-height:1.4;quotes:"“" "”";margin:8px 0}
.who{display:flex;align-items:center;gap:9px}
.who .av{width:30px;height:30px;border-radius:50%;background:var(--tint);color:var(--acc);display:grid;place-items:center;font-weight:800;font-size:12px}
.who b{font-size:12.5px}.who small{display:block;font-size:10.5px;color:var(--muted)}
.rdots{display:flex;gap:5px;justify-content:center;margin-top:10px}
.rdots i{width:5px;height:5px;border-radius:9px;background:#D9D5F3;transition:.3s}
.rdots i.on{width:18px;background:var(--acc)}
/* list */
.list{display:grid;gap:10px}
.row{display:flex;align-items:center;gap:12px;background:#fff;border-radius:20px;padding:10px 12px;box-shadow:0 6px 18px -12px rgba(40,30,90,.3)}
.row .th{width:46px;height:46px;border-radius:50%;background:var(--tint);color:var(--acc);display:grid;place-items:center;flex:none}
.row .th svg{width:21px;height:21px}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:13.5px;font-weight:700;line-height:1.25}
.row .tx small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tg{font-size:10.5px;font-weight:700;color:var(--acc);background:var(--tint2);border-radius:999px;padding:4px 8px;flex:none;display:flex;align-items:center;gap:4px}
.row .tg svg{width:11px;height:11px}
.row .ch{width:16px;height:16px;color:#B5B5C3;flex:none}
/* profile */
.ptop{display:flex;justify-content:space-between;align-items:center}
.phead{display:grid;grid-template-columns:1fr 130px;gap:12px;align-items:end;margin-top:16px}
.pill{display:inline-block;font-size:11px;font-weight:700;color:var(--acc);background:var(--tint);border-radius:999px;padding:5px 11px}
.phead h2{font-size:clamp(22px,6.4vw,27px);font-weight:800;letter-spacing:-.035em;line-height:1.1;margin:10px 0 8px}
.addr{display:flex;gap:6px;align-items:flex-start;font-size:12.5px;color:var(--muted)}
.addr svg{width:15px;height:15px;flex:none;margin-top:2px;color:var(--acc)}
.pphoto{height:160px;border-radius:26px 26px 26px 60px;overflow:hidden;background:var(--tint)}
.pphoto img{width:100%;height:100%;object-fit:cover;display:block}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--tile);border-radius:18px;padding:12px 10px}
.tile .ti{width:30px;height:30px;border-radius:50%;background:#fff;color:var(--acc);display:grid;place-items:center;margin-bottom:8px}
.tile .ti svg{width:15px;height:15px}
.tile b{display:block;font-size:13px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.tile small{font-size:11px;color:var(--muted)}
.drow{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;margin-bottom:10px}
.drow svg{width:17px;height:17px;color:var(--acc)}
.days{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -18px 12px;padding:2px 18px 6px}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:54px;padding:9px 0;border-radius:18px;background:#fff;text-align:center;box-shadow:0 4px 14px -8px rgba(40,30,90,.25);font-size:11px;color:var(--muted);font-weight:600}
.day b{display:block;font-size:16px;color:var(--ink);font-weight:800}
.day.on{background:var(--acc);color:#E4DFFC}.day.on b{color:#fff}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{padding:10px 0;border-radius:999px;border:1.5px solid var(--line);font-weight:700;font-size:12.5px;background:#fff;transition:.2s}
.slot.on{background:var(--acc);border-color:var(--acc);color:#fff}
.slot:disabled{color:#C7C7D2;background:var(--tile);border-color:var(--tile);cursor:not-allowed;text-decoration:line-through}
.hint{font-size:11px;color:var(--muted);margin-top:8px}
/* calc */
.calc{background:#fff;border-radius:24px;padding:16px;box-shadow:var(--sh)}
.cl{font-size:11.5px;font-weight:700;color:var(--muted);margin:2px 0 8px;display:flex;align-items:center;gap:6px}
.cl i{font-style:normal;width:18px;height:18px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:10px}
.opts{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.opt span{display:inline-block;padding:8px 13px;border-radius:999px;background:var(--tile);font-size:12.5px;font-weight:600;cursor:pointer;transition:.2s}
.opt input:checked+span{background:var(--acc);color:#fff}
.opt input:focus-visible+span{outline:2px solid var(--acc);outline-offset:2px}
.res{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--tint);border-radius:18px;padding:12px 14px;flex-wrap:wrap}
.res small{display:block;font-size:11px;color:var(--muted);font-weight:600}
.res .pv{font-size:22px;font-weight:800;color:var(--acc);letter-spacing:-.03em;line-height:1.1}
.res a{background:var(--acc);color:#fff;border-radius:999px;padding:10px 14px;font-weight:700;font-size:12.5px;display:flex;align-items:center;gap:6px}
.res a svg{width:15px;height:15px}
.note{font-size:11px;color:var(--muted);margin-top:8px}
/* map */
.mapw{max-width:480px;margin:0 auto;padding:10px 18px 0}
@media(min-width:960px){.mapw{max-width:916px;padding-top:40px}}
.mapc{background:#fff;border-radius:28px;overflow:hidden;box-shadow:var(--sh)}
.mapc iframe{width:100%;height:260px;border:0;display:block}
@media(min-width:960px){.mapc iframe{height:320px}}
.mapc .mi{padding:14px 16px;display:flex;gap:10px;align-items:center}
.mapc .mi .th{width:40px;height:40px;border-radius:50%;background:var(--tint);color:var(--acc);display:grid;place-items:center;flex:none}
.mapc .mi svg{width:18px;height:18px}
.mapc .mi b{display:block;font-size:13.5px}.mapc .mi small{font-size:12px;color:var(--muted)}
footer{max-width:916px;margin:0 auto;padding:22px 18px 10px;text-align:center;font-size:11.5px;color:var(--muted)}
footer b{color:var(--ink)}
/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:60;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(247,247,250,0),rgba(247,247,250,.96) 35%)}
.bar-in{max-width:480px;margin:0 auto;display:flex;gap:10px;align-items:center}
.chat{width:54px;height:54px;border-radius:50%;background:#fff;box-shadow:var(--sh);display:grid;place-items:center;color:var(--acc);flex:none}
.chat svg{width:22px;height:22px}
.book{flex:1;height:54px;border-radius:999px;background:var(--acc);color:#fff;font-weight:700;font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 14px 28px -12px rgba(108,92,231,.9);min-width:0;padding:0 14px;text-align:center}
.book svg{width:19px;height:19px;flex:none}
.book span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:350px){.tiles{grid-template-columns:1fr 1fr}.phead{grid-template-columns:1fr 110px}}
</style>
</head>

<div class="app">
 <!-- PANTALLA 1 -->
 <main class="screen" id="inicio">
  <div class="top">
   <div class="me"><span class="avatar" id="avatar"></span><div><small id="hello"></small><b id="brand"></b></div></div>
   <div class="rbtns"><a class="rb wa-link" href="#" target="_blank" rel="noopener" aria-label="WhatsApp"><svg><use href="#wa"/></svg></a><a class="rb" id="telBtn" href="#contacto" aria-label="Llamar"><svg><use href="#tel"/></svg></a></div>
  </div>
  <div class="greet"><div class="l1" id="g1"></div><div class="l2" id="g2"></div><p id="gsub"></p></div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="cards" id="cards"></div>

<script>
(function(){
function $(i){return document.getElementById(i);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function wa(t){return (D.wa?'https://wa.me/'+D.wa:'https://wa.me/')+'?text='+encodeURIComponent(t);}
function ic(n){return '<svg><use href="#'+n+'"/></svg>';}
function fmt(n){return '$'+(Math.round(n/1000)*1000).toLocaleString('es-AR');}
var h=new Date().getHours();
$('hello').textContent=h<12?'¡Buen día!':h<20?'¡Buenas tardes!':'¡Buenas noches!';
$('g1').textContent=h<12?'Buen día,':h<20?'Buenas tardes,':'Buenas noches,';
$('g2').textContent=D.greet2;$('gsub').textContent=D.sub;
$('avatar').textContent=D.initial;$('brand').textContent=D.brand;$('brandF').textContent=D.brand;
document.querySelectorAll('.wa-link').forEach(function(a){a.href=wa(D.msg);});
if(D.tel){$('telBtn').href='tel:'+D.tel;}
/* tabs + cards + list */
var cur=0,all=false;
D.tabs.forEach(function(t,i){$('tabs').insertAdjacentHTML('beforeend','<button type="button" class="tab'+(i===0?' on':'')+'" role="tab" data-i="'+i+'">'+esc(t.name)+'</button>');});
function render(){
 [].forEach.call($('tabs').children,function(b,i){b.classList.toggle('on',i===cur);});
 var t=D.tabs[cur];
 $('cards').innerHTML=t.cards.map(function(c){return '<article class="pcard"><span class="badge'+(t.urgent?' u':'')+'">'+(t.urgent?'Hoy':'Disponible')+'</span><div class="cimg">'+ic(c.icon||t.icon)+'</div><h4>'+esc(c.name)+'</h4><div class="s">'+esc(c.sub)+'</div><div class="rt"><i>★</i> '+D.rating+' · '+esc(D.ratingSrc)+'</div><div class="pr"><small>desde</small>'+fmt(c.price)+'</div></article>';}).join('');
 var items=all?[].concat.apply([],D.tabs.map(function(x){return x.list.map(function(l){return {l:l,t:x};});})):t.list.map(function(l){return {l:l,t:t};});
 $('list').innerHTML=items.map(function(o){return '<a class="row wa-row" href="'+wa('Hola, vi tu web y quiero consultar por: '+o.l.t)+'" target="_blank" rel="noopener"><span class="th">'+ic(o.t.icon)+'</span><span class="tx"><b>'+esc(o.l.t)+'</b><small>'+esc(o.l.s||o.t.name)+'</small></span><span class="tg">'+ic(o.l.tag==='CABA'?'pin':'clock')+esc(o.l.tag||D.tag)+'</span><svg class="ch"><use href="#chev"/></svg></a>';}).join('');
 $('seeAll').textContent=all?'Ver menos':'Ver todos';
}
$('tabs').addEventListener('click',function(e){var b=e.target.closest('.tab');if(!b)return;cur=+b.dataset.i;all=false;render();});
$('seeAll').addEventListener('click',function(){all=!all;render();});
render();
/* reviews */
$('revLbl').textContent=D.revLabel;
D.reviews.forEach(function(r,i){$('revs').insertAdjacentHTML('beforeend','<article class="rv'+(i===0?' on':'')+'"><div class="hd"><span class="sc">★ '+D.rating+'<span style="font-weight:600;color:var(--muted)"> · '+esc(D.ratingCount)+'</span></span><span class="stars">★★★★★</span></div><q>'+esc(r.t)+'</q><div class="who"><span class="av">'+esc(r.n[0])+'</span><div><b>'+esc(r.n)+'</b><small>'+esc(D.revSmall)+'</small></div></div></article>');$('rdots').insertAdjacentHTML('beforeend','<i'+(i===0?' class="on"':'')+'></i>');});
var rv=$('revs').children,ri=0;
setInterval(function(){rv[ri].classList.remove('on');$('rdots').children[ri].className='';ri=(ri+1)%rv.length;rv[ri].classList.add('on');$('rdots').children[ri].className='on';},1500);
/* profile */
var P=D.profile;$('ptag').textContent=P.tag;$('pname').textContent=P.name;$('paddr').textContent=P.addr;$('pphoto').src=P.photo;$('pphoto').alt=P.alt;
$('tiles').innerHTML=P.tiles.map(function(t){return '<div class="tile"><span class="ti">'+ic(t.icon)+'</span><b>'+esc(t.v)+'</b><small>'+esc(t.l)+'</small></div>';}).join('');
$('turnoTitle').textContent=D.turnoTitle;
/* turnos */
var dn=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'],mn=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var days=[],d0=new Date();d0.setHours(0,0,0,0);
for(var k=1;days.length<7;k++){var d=new Date(d0);d.setDate(d0.getDate()+k);if(D.closedDays.indexOf(d.getDay())>-1)continue;days.push(d);}
var sd=0,ss=-1;
function slotsR(){
 $('month').textContent=mn[days[sd].getMonth()].replace(/^./,function(c){return c.toUpperCase();})+' '+days[sd].getFullYear();
 [].forEach.call($('days').children,function(b,i){b.classList.toggle('on',i===sd);});
 var seed=days[sd].getDate();
 $('slots').innerHTML=D.slots.map(function(s,i){var dis=((seed+i)%4===3);return '<button type="button" class="slot" data-i="'+i+'"'+(dis?' disabled':'')+'>'+s+'</button>';}).join('');
 var first=[].filter.call($('slots').children,function(b){return !b.disabled;})[0];ss=first?+first.dataset.i:-1;mark();
}
function mark(){[].forEach.call($('slots').children,function(b){b.classList.toggle('on',+b.dataset.i===ss);});
 var dd=days[sd],lbl=dn[dd.getDay()]+' '+dd.getDate()+'/'+(dd.getMonth()+1)+(ss>-1?' · '+D.slots[ss]:'');
 $('bookTxt').textContent=D.bookTxt+' · '+lbl;
 $('book').href=wa(D.bookMsg+'\n• Día: '+dn[dd.getDay()]+' '+dd.getDate()+'/'+(dd.getMonth()+1)+(ss>-1?'\n• Horario: '+D.slots[ss]:'')+'\n¿Tenés disponibilidad?');}
$('days').innerHTML=days.map(function(d,i){return '<button type="button" class="day" data-i="'+i+'">'+dn[d.getDay()]+'<b>'+d.getDate()+'</b></button>';}).join('');
$('days').addEventListener('click',function(e){var b=e.target.closest('.day');if(!b)return;sd=+b.dataset.i;slotsR();});
$('slots').addEventListener('click',function(e){var b=e.target.closest('.slot');if(!b||b.disabled)return;ss=+b.dataset.i;mark();});
slotsR();
/* calculadora */
var URG=D.urg||[[1,'Esta semana'],[1.15,'En 24-48 h'],[1.3,'Hoy mismo']];
$('c1l').textContent=D.calcQ1;
D.calc.forEach(function(c,i){$('oCat').insertAdjacentHTML('beforeend','<label class="opt"><input type="radio" name="cat" value="'+i+'"'+(i===0?' checked':'')+'><span>'+esc(c.n)+'</span></label>');});
URG.forEach(function(u,i){$('oUrg').insertAdjacentHTML('beforeend','<label class="opt"><input type="radio" name="urg" value="'+i+'"'+(i===0?' checked':'')+'><span>'+u[1]+'</span></label>');});
function v(n){return +document.querySelector('input[name="'+n+'"]:checked').value;}
function jobs(){$('oJob').innerHTML=D.calc[v('cat')].j.map(function(j,i){return '<label class="opt"><input type="radio" name="job" value="'+i+'"'+(i===0?' checked':'')+'><span>'+esc(j[0])+'</span></label>';}).join('');}
function calc(){var c=D.calc[v('cat')],j=c.j[v('job')],u=URG[v('urg')],p=j[1]*u[0];$('pv').textContent=fmt(p);
 $('calcWa').href=wa('Hola, vi tu web y quiero un presupuesto:\n• Servicio: '+c.n+'\n• Trabajo: '+j[0]+'\n• Para: '+u[1]+'\n• Estimado de la web: desde '+fmt(p));}
$('calc').addEventListener('change',function(e){if(e.target.name==='cat')jobs();calc();});
jobs();calc();$('pnote').textContent=D.priceNote;
/* mapa y pie */
$('map').src='https://www.google.com/maps?q='+encodeURIComponent(D.map.q)+'&output=embed';$('map').title='Mapa '+D.map.t;
$('mapT').textContent=D.map.t;$('mapS').textContent=D.map.s;$('zoneLbl').textContent=D.map.zone;
$('footS').textContent=' · '+D.foot;$('credits').textContent=D.credits;
})();
